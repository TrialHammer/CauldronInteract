name: CauldronInteract
version: '${project.version}-${paper.version}'
api-version: '${paper.api-version}'
authors: [VoxCrafter_LP, savagetricycle]
main: com.voxcrafterlp.cauldroninteract.CauldronInteract
description: Adds dispenser cauldron interactions and hopper distillation for BreweryX
softdepend: [BreweryX]
commands:
  cauldroninteract:
    description: Reloads configuration or shows plugin status.
    usage: /cauldroninteract <reload|status>
    permission: cauldroninteract.admin
    aliases: [ci]
permissions:
  cauldroninteract.admin:
    description: Allows reloading CauldronInteract and viewing its status.
    default: op
